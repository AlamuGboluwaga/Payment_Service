spring.application.name=payment-service
#server.port=${SERVER_PORT:8085}
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/payment_db}
spring.datasource.username=${DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DATASOURCE_PASSWORD :SpringBoot@2026}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

paystack.secret-key=${PAYSTACK_SECRET_KEY}
paystack.callback-url=${PAYSTACK_CALLBACK_URL:http://localhost:8085/api/payments/callback}
# Reduce logging level
logging.level.root= info
# Turn off Spring banner
spring.main.banner-mode=off